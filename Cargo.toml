[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]

[workspace.dependencies]

# workspace member crates
allay-base = { path = "crates/allay-base" }
allay-plugin-host = { path = "crates/allay-plugin-host" }
allay-compiler = { path = "crates/allay-compiler", default-features = false }
allay-publish = { path = "crates/allay-publish", default-features = false }
allay-web = { path = "crates/allay-web", default-features = false }
allay-plugin = { path = "crates/allay-plugin" }

axum = { version = "0.8", default-features = false }
tokio = { version = "1.53", default-features = false, features = ["rt"] }
tokio-util = { version = "0.7", features = ["io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
toml = "1.1"
anyhow = "1.0"
tempfile = "3.27"
notify = "8.2"
notify-debouncer-full = "0.7"
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
itertools = "0.15"
clap = { version = "4.6", features = ["derive", "env", "cargo"] }
git2 = "0.21"
dialoguer = "0.12"
webbrowser = "1.2"
pulldown-cmark = "0.13"
pest = "2.9"
pest_derive = "2.9"
regex = "1.13"
wit-bindgen = "0.61"
wasmtime = "48.0"
wasmtime-wasi = "48.0"
mime_guess = "2.0"
cfg-if = "1.0"
rayon = "1.12"
semver = "1.0"
lol_html = "3.0"
reqwest = { version = "0.13", features = ["blocking", "json"] }
